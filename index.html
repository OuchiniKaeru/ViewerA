<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ローカルファイルを安全に閲覧するデスクトップビューアー"
    />
    <title>ViewerA</title>
    <link rel="icon" type="image/png" href="/src-tauri/icons/32x32.png" />
  </head>
  <body>
    <div class="app-shell">
      <div class="toolbar">
        <div class="breadcrumbs" id="breadcrumbs" aria-label="現在のフォルダ"></div>
        <div class="toolbar-actions">
          <select class="search-mode" id="searchMode" aria-label="検索対象">
            <option value="name">名前</option>
            <option value="content">内容</option>
          </select>
          <label class="search-box">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
            <input id="searchInput" type="search" placeholder="ファイルを検索" aria-label="現在のフォルダ内を検索" />
            <kbd>Ctrl F</kbd>
          </label>
          <button class="button button-primary" id="openFolderButton">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5h6l2 2H20a1.5 1.5 0 0 1 1.5 1.5v7.5a1.5 1.5 0 0 1-1.5 1.5h-16a1.5 1.5 0 0 1-1.5-1.5v-9a1.5 1.5 0 0 1 1.5-1.5Z"/></svg>
            フォルダを開く
          </button>
          <button class="icon-button" id="settingsButton" aria-label="設定" title="設定">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19.4 15 .1.1a1.8 1.8 0 0 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3 .9v.2a1.8 1.8 0 0 1-3.6 0v-.2a1.8 1.8 0 0 0-3-.9l-.1.1a1.8 1.8 0 1 1-2.5-2.5l.1-.1a1.8 1.8 0 0 0-.9-3H3.7a1.8 1.8 0 0 1 0-3.6h.2a1.8 1.8 0 0 0 .9-3l-.1-.1a1.8 1.8 0 1 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3-.9v-.2a1.8 1.8 0 0 1 3.6 0v.2a1.8 1.8 0 0 0 3 .9l.1-.1a1.8 1.8 0 1 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 .9 3h.2a1.8 1.8 0 0 1 0 3.6h-.2a1.8 1.8 0 0 0-.9 3Z"/></svg>
          </button>
        </div>
      </div>

      <section class="agent-results" id="agentResults" aria-label="Agent Results" hidden>
        <div class="agent-results-header">
          <div>
            <div class="eyebrow">AGENT RESULTS</div>
            <h2>エージェントの成果物</h2>
          </div>
          <button class="icon-button" id="dismissAgentResultsButton" aria-label="結果一覧を閉じる" title="結果一覧を閉じる">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="agent-result-list" id="agentResultList"></div>
      </section>

      <div class="workspace preview-closed">
        <aside class="sidebar" aria-label="場所">
          <div class="sidebar-section">
            <div class="section-heading">ライブラリ</div>
            <div id="rootList" class="root-list"></div>
            <button class="add-root-button" id="addRootButton">
              <span aria-hidden="true">＋</span> フォルダを追加
            </button>
            <section class="saved-group" aria-label="お気に入り">
              <div class="section-heading">お気に入り</div>
              <div id="favoriteList" class="saved-reference-list"></div>
            </section>
            <section class="saved-group" aria-label="最近使った項目">
              <div class="section-heading">最近使った項目</div>
              <div id="recentFileList" class="saved-reference-list"></div>
            </section>
          </div>
          <div class="sidebar-footer">
            <span class="status-dot"></span>
            <span>ローカルのみ・閲覧専用</span>
          </div>
        </aside>

        <div class="resize-handle" id="sidebarResizeHandle" role="separator" aria-orientation="vertical" aria-label="サイドバーの幅を変更" tabindex="0"></div>

        <section class="file-browser" aria-label="ファイル一覧">
          <div class="browser-heading">
            <div>
              <div class="eyebrow" id="folderLabel">ライブラリ</div>
              <h1 id="folderTitle">フォルダを選択</h1>
            </div>
            <div class="browser-controls">
              <button class="icon-button" id="refreshButton" aria-label="再読み込み" title="再読み込み">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M19 12a7 7 0 0 0-12.1-4.8L5 9"/><path d="M4 17v-5h5"/><path d="M5 12a7 7 0 0 0 12.1 4.8L19 15"/></svg>
              </button>
              <button class="icon-button" id="togglePreviewButton" aria-label="プレビューを閉じる" title="プレビューを閉じる">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v13H4z"/><path d="M15 5.5v13"/></svg>
              </button>
            </div>
          </div>

          <div class="table-header" aria-hidden="true">
            <span>名前</span><span>種類</span><span>サイズ</span><span>更新日時</span>
          </div>
          <div id="fileList" class="file-list" role="list"></div>
          <div id="emptyState" class="empty-state">
            <div class="empty-icon" aria-hidden="true">
              <svg viewBox="0 0 48 48"><path d="M8 13h12l4 4h16v19H8z"/><path d="M8 18h32"/></svg>
            </div>
            <h2>フォルダを開いて始めましょう</h2>
            <p>選択したフォルダ内のファイルを安全に閲覧できます。</p>
            <button class="button button-primary" id="emptyOpenButton">フォルダを選択</button>
          </div>
          <div class="pagination" id="pagination" hidden>
            <button class="button button-secondary" id="previousPageButton">前へ</button>
            <span id="pageLabel"></span>
            <button class="button button-secondary" id="nextPageButton">次へ</button>
          </div>
        </section>

        <div class="resize-handle preview-resize-handle" id="previewResizeHandle" role="separator" aria-orientation="vertical" aria-label="プレビューの幅を変更" tabindex="0"></div>

        <aside class="preview-panel" id="previewPanel" aria-label="プレビュー" hidden>
          <div class="preview-header">
            <div class="preview-file-icon" id="previewFileIcon" aria-hidden="true">FILE</div>
            <div class="preview-heading">
              <h2 id="previewTitle">プレビュー</h2>
              <span id="previewSubtitle"></span>
            </div>
            <button class="icon-button" id="closePreviewButton" aria-label="プレビューを閉じる">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
            </button>
          </div>
          <div class="preview-toolbar" id="previewToolbar"></div>
          <div class="preview-content" id="previewContent" aria-live="polite"></div>
        </aside>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
